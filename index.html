<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport (zoom habilitado por accesibilidad) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="Consulta el clima actual de cualquier ciudad del mundo con SkyGlow. Interfaz moderna, datos precisos en tiempo real."
    />
    <meta name="author" content="Sebastián Cettour" />
    <meta name="theme-color" content="#0f2027" />
    <link rel="canonical" href="https://skyglow.com.ar/" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:title" content="SkyGlow" />
    <meta
      property="og:description"
      content="Consulta el clima actual de cualquier ciudad del mundo con SkyGlow."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />

    <!-- Icono -->
    <link rel="icon" href="/nube_sol.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/nube_sol.ico" />

    <!-- Google Fonts (una sola request combinada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>SkyGlow</title>

    <style>
      html,
      body {
        font-size: 16px;
        scroll-behavior: smooth;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background: var(--background-gradient, #0f2027);
        background-attachment: fixed;
        color: var(--text-main, #fff);
      }

      body {
        font-family: "Outfit", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <main id="root" aria-label="Contenido principal"></main>

    <noscript>
      Esta aplicación necesita JavaScript habilitado para funcionar.
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
